<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Polls</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Pulse Polls</h1>
    <div id="auth-buttons">
      <button id="google-signin">Sign in with Google</button>
      <button id="signout" style="display:none;">Sign Out</button>
    </div>
  </header>

  <main>
    <section id="create-poll">
      <h2>Create a Poll</h2>
      <input type="text" id="poll-title" placeholder="Poll title">
      <textarea id="poll-options" placeholder="Enter options separated by commas"></textarea>
      <select id="poll-visibility">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
      <button id="create-poll-btn">Create Poll</button>
    </section>

    <section id="poll-list">
      <h2>Available Polls</h2>
      <ul id="polls"></ul>
    </section>
  </main>

<script type="module">
  // Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-analytics.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, doc, getDocs, onSnapshot, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBJSa3mn6TWLU8gXIpm1SBFPmfEdBY2Sc8",
    authDomain: "pulse-b8d03.firebaseapp.com",
    projectId: "pulse-b8d03",
    storageBucket: "pulse-b8d03.firebasestorage.app",
    messagingSenderId: "386931304987",
    appId: "1:386931304987:web:522326521ffc8c3db066be",
    measurementId: "G-MHL78LEBHF"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const googleBtn = document.getElementById('google-signin');
  const signoutBtn = document.getElementById('signout');
  const createBtn = document.getElementById('create-poll-btn');
  const pollList = document.getElementById('polls');

  let currentUser = null;

  // Auth
  googleBtn.onclick = () => signInWithPopup(auth, provider);
  signoutBtn.onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    currentUser = user;
    if(user){
      googleBtn.style.display = "none";
      signoutBtn.style.display = "inline-block";
    } else {
      googleBtn.style.display = "inline-block";
      signoutBtn.style.display = "none";
    }
  });

  // Create Poll
  createBtn.onclick = async () => {
    if(!currentUser){
      alert("Sign in first!");
      return;
    }

    const title = document.getElementById('poll-title').value;
    const optionsText = document.getElementById('poll-options').value;
    const visibility = document.getElementById('poll-visibility').value;

    if(!title || !optionsText){
      alert("Fill all fields!");
      return;
    }

    const options = optionsText.split(',').map(o => o.trim()).filter(Boolean);
    const pollData = {
      title,
      options: options.map(opt => ({name: opt, votes: []})),
      visibility,
      owner: currentUser.uid,
      createdAt: serverTimestamp()
    };

    await addDoc(collection(db, 'polls'), pollData);
    document.getElementById('poll-title').value = '';
    document.getElementById('poll-options').value = '';
  };

  // List Polls
  const pollCol = collection(db, 'polls');
  onSnapshot(pollCol, snapshot => {
    pollList.innerHTML = '';
    snapshot.docs.forEach(docSnap => {
      const data = docSnap.data();
      const li = document.createElement('li');
      li.innerHTML = `<strong>${data.title}</strong> (${data.visibility}) <br> ${data.options.map((opt,i) => `<button onclick="vote('${docSnap.id}',${i})">${opt.name} (${opt.votes.length})</button>`).join(' ')}`;
      pollList.appendChild(li);
    });
  });

  // Vote
  window.vote = async (pollId, optionIndex) => {
    if(!currentUser){
      alert("Sign in to vote!");
      return;
    }

    const pollRef = doc(db, 'polls', pollId);
    const pollSnap = await getDocs(collection(db, 'polls'));
    const poll = (await pollRef.get()).data();

    await updateDoc(pollRef, {
      [`options.${optionIndex}.votes`]: arrayUnion(currentUser.uid)
    });
  };
</script>
</body>
</html>
